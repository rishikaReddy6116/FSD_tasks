<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Events | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h2 class="mb-4 text-center">Event Registration</h2>
                
                <div id="successAlert" class="alert alert-success d-none alert-dismissible fade show" role="alert">
                    <strong>Success!</strong> You have successfully registered for the event.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form id="eventRegForm" onsubmit="submitRegistration(event)">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Student Name</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Roll Number</label>
                                    <input type="text" class="form-control" required>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Branch/Department</label>
                                    <select class="form-select" required>
                                        <option value="">Select Branch...</option>
                                        <option>Computer Science</option>
                                        <option>Information Technology</option>
                                        <option>Electronics</option>
                                        <option>Mechanical</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Event Selection</label>
                                    <select class="form-select" required>
                                        <option value="">Select Event...</option>
                                        <option>Technical Quiz</option>
                                        <option>Hackathon</option>
                                        <option>Poster Presentation</option>
                                        <option>Coding Contest</option>
                                        <option>Project Expo</option>
                                        <option>Cultural Fest</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Mobile Number</label>
                                    <input type="tel" class="form-control" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Complete Registration</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function submitRegistration(e) {
            e.preventDefault();
            document.getElementById('successAlert').classList.remove('d-none');
            document.getElementById('eventRegForm').reset();
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
