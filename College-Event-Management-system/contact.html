<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Events | Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h2 class="text-center mb-5">Contact Event Coordinators</h2>
        <div class="row g-5">
            <div class="col-lg-7">
                <div class="card shadow-sm h-100">
                    <div class="card-body p-4">
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Your Name</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Query/Message</label>
                                <textarea class="form-control" rows="4" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-5">
                <div class="card shadow-sm h-100 bg-light border-0">
                    <div class="card-body p-4">
                        <h4 class="mb-4">Coordinator Details</h4>
                        <p><strong>Dr. John Smith</strong><br>Chief Event Organizer<br>Email: j.smith@college.edu<br>Phone: +1 555-0198</p>
                        <hr>
                        <p><strong>Sarah Jenkins</strong><br>Student Representative<br>Email: s.jenkins@college.edu<br>Phone: +1 555-0199</p>
                        
                        <h5 class="mt-4 mb-3">Follow Us</h5>
                        <a href="#" class="btn btn-outline-primary btn-sm me-2">Facebook</a>
                        <a href="#" class="btn btn-outline-info btn-sm me-2">Twitter</a>
                        <a href="#" class="btn btn-outline-danger btn-sm">Instagram</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
