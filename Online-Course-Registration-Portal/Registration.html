<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h2 class="mb-4">Course Registration Form</h2>
                
                <div id="successAlert" class="alert alert-success d-none" role="alert">
                    Registration successful! We will contact you shortly.
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="regForm" onsubmit="submitForm(event)">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" required>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Mobile Number</label>
                                    <input type="tel" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label d-block">Gender</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" value="male" required>
                                        <label class="form-check-label">Male</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" value="female">
                                        <label class="form-check-label">Female</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Course Selection</label>
                                    <select class="form-select" required>
                                        <option value="">Select a Course...</option>
                                        <option>Web Development</option>
                                        <option>Python Programming</option>
                                        <option>Data Science</option>
                                        <option>AI & Machine Learning</option>
                                        <option>Java Programming</option>
                                        <option>Cloud Computing</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Highest Qualification</label>
                                    <input type="text" class="form-control" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <textarea class="form-control" rows="3" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Upload Resume (PDF/DOCX)</label>
                                <input class="form-control" type="file" required>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" required>
                                <label class="form-check-label">I agree to the Terms & Conditions</label>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Submit Registration</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function submitForm(e) {
            e.preventDefault(); // Prevent page reload
            document.getElementById('successAlert').classList.remove('d-none');
            document.getElementById('regForm').reset();
            window.scrollTo(0, 0); // Scroll to top to see alert
        }
    </script>
</body>
</html>
